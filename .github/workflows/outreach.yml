name: 🌐 Cloud Outreach Scheduler

on:
  schedule:
    - cron: '45 11 * * *'  # 5:15 PM IST
    - cron: '0 0 * * *'    # 5:30 AM IST
  workflow_dispatch:

concurrency:
  group: outreach-scheduler
  cancel-in-progress: false

jobs:
  send-outreach:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_PATH: "database/leads.db"
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name:  Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name:  Install Dependencies
        run: pip install -r requirements.txt

      # ✅ STEP 1: Create Directory + Sync DB from Supabase
      - name: ️ Initialize & Sync Database
        run: |
          mkdir -p database
          python << 'EOF'
          import os, sys, sqlite3
          from supabase import create_client
          
          db_path = os.getenv('DATABASE_PATH', 'database/leads.db')
          print(f'🔍 DEBUG: DATABASE_PATH={db_path}', flush=True)
          
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()
          
          cursor.execute('''CREATE TABLE IF NOT EXISTS leads (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              creator_name TEXT, email TEXT UNIQUE, platform TEXT,
              niche TEXT, followers TEXT, country TEXT, profile_url TEXT,
              status TEXT, created_at TEXT, next_follow_up TEXT,
              follow_up_count INTEGER DEFAULT 0, reply_status TEXT DEFAULT 'pending'
          )''')
          conn.commit()
          print('✅ Table created/verified', flush=True)
          
          supabase = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_KEY'))
          leads = supabase.table('leads').select('*').execute().data
          print(f'📥 Fetched {len(leads)} leads from Supabase', flush=True)
          
          cursor.execute('DELETE FROM leads')
          for l in leads:
              l.pop('id', None)
              cursor.execute(
                  'INSERT OR IGNORE INTO leads (creator_name,email,platform,niche,followers,country,profile_url,status,created_at,next_follow_up,follow_up_count,reply_status) VALUES (?,?,?,?,?,?,?,?,?,?,?,?)',
                  (l.get('creator_name'), l.get('email'), l.get('platform'), l.get('niche'), l.get('followers'), l.get('country'), l.get('profile_url'), l.get('status'), l.get('created_at'), l.get('next_follow_up'), l.get('follow_up_count',0), l.get('reply_status','pending'))
              )
          conn.commit()
          print(f'✅ DB Synced: {len(leads)} leads written to {db_path}', flush=True)
          conn.close()
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: 🔒 Clear Stale Locks
        run: rm -f scheduler.lock followup.lock

      # ✅ STEP 2: Run Outreach + Inline Supabase Sync (WITH HARD STOP + VISIBLE LOGS)
      - name:  Run Outreach Job
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          DATABASE_PATH: ${{ env.DATABASE_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python << 'EOF'
          import os, sys, time, random, sqlite3
          from supabase import create_client
          from outreach.mailer import Mailer
          from outreach.sender import OutreachSender
          from core.validator import Validator
          from outreach.templates import INITIAL_TEMPLATE
          from config.settings import DATABASE_PATH

          print('[CLOUD] ✅ Supabase client initialized', flush=True)
          supabase = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_KEY'))
          print(f'🔍 DEBUG: Scheduler using DATABASE_PATH={DATABASE_PATH}', flush=True)
          print('[SCHEDULER] Starting scheduled outreach...', flush=True)

          conn = sqlite3.connect(DATABASE_PATH, check_same_thread=False)
          conn.row_factory = sqlite3.Row
          cursor = conn.cursor()

          # ✅ Fetch new leads (preserving your original query)
          cursor.execute("""
              SELECT * FROM leads 
              WHERE status = 'new' OR status IS NULL 
              ORDER BY created_at ASC 
              LIMIT 20
          """)
          rows = cursor.fetchall()
          if not rows:
              print('[SCHEDULER] No new leads found.', flush=True)
              conn.close()
              sys.exit(0)

          leads = [dict(row) for row in rows]
          print(f'[SCHEDULER] Total fetched: {len(leads)}', flush=True)

          # ✅ Validate emails
          valid_leads = [lead for lead in leads if Validator.valid_email(lead.get('email', ''))]
          if not valid_leads:
              print('[SCHEDULER] No valid leads after filtering.', flush=True)
              conn.close()
              sys.exit(0)

          print(f'[SCHEDULER] Valid leads to send: {len(valid_leads)}', flush=True)

          mailer = Mailer()
          sent_count = 0
          MAX_EMAILS = 20  # ✅ HARD STOP: Never send more than 20

          for lead in valid_leads:
              # ✅ HARD STOP: Break immediately after 20 sends
              if sent_count >= MAX_EMAILS:
                  print(f'[SCHEDULER] 🛑 HARD STOP: Reached {MAX_EMAILS} emails sent. Exiting loop.', flush=True)
                  break

              try:
                  body = INITIAL_TEMPLATE.format(name=lead.get('creator_name', 'Creator'))
                  success = mailer.send_email(
                      recipient=lead['email'],
                      subject='Custom Monetization Strategy For Your Content',
                      body=body
                  )

                  if success:
                      # 1️⃣ Update SQLite FIRST (atomic)
                      cursor.execute('UPDATE leads SET status = ? WHERE email = ?', ('sent', lead['email']))
                      conn.commit()
                      print(f'[DB] ✅ SQLite updated: {lead["email"]} → sent', flush=True)

                      # 2️⃣ Sync to Supabase IMMEDIATELY (with retry logic)
                      supabase_synced = False
                      for retry in range(3):
                          try:
                              supabase.table('leads').update({'status': 'sent'}).eq('email', lead['email']).execute()
                              print(f'[CLOUD] ✅ Supabase updated: {lead["email"]} → sent', flush=True)
                              supabase_synced = True
                              break
                          except Exception as cloud_err:
                              print(f'[CLOUD] ⚠️ Retry {retry+1}/3 for {lead["email"]}: {cloud_err}', flush=True)
                              time.sleep(2)
                      
                      if not supabase_synced:
                          print(f'[CLOUD] ❌ Failed to sync {lead["email"]} after 3 retries', flush=True)

                      sent_count += 1
                      # ✅ Visible progress log (shows exactly when it stops)
                      print(f'[PROGRESS] {sent_count}/{MAX_EMAILS} emails sent', flush=True)

                      # ✅ Delay between sends (prevents Gmail throttling)
                      if sent_count < MAX_EMAILS:  # No delay after last email
                          delay = random.uniform(45, 120)
                          print(f'[DELAY] Waiting {delay:.1f}s before next email...', flush=True)
                          time.sleep(delay)
                  else:
                      print(f'[MAIL] ❌ Failed to send to {lead["email"]}', flush=True)

              except Exception as e:
                  print(f'[ERROR] Processing {lead.get("email")}: {e}', flush=True)
                  import traceback
                  traceback.print_exc(file=sys.stderr)
                  # Continue to next lead instead of crashing entire job

          # ✅ Final summary log (always visible)
          print(f'[SCHEDULER] Completed. {sent_count}/{len(valid_leads)} emails sent.', flush=True)
          print(f'[SCHEDULER] Hard stop enforced: MAX_EMAILS={MAX_EMAILS}', flush=True)
          conn.close()
          EOF